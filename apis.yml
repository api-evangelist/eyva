aid: eyva
name: Eyva
description: >-
  Eyva (operated by datazeit GmbH of Cologne, Germany) is an AI-powered
  portfolio-intelligence platform for the beauty and personal-care industry. It
  unifies consumer, market, and product data so product, marketing, and R&D
  teams can detect emerging consumer trends across Google search, TikTok,
  Instagram, and product reviews, benchmark their portfolio, run gap and
  competitive analysis, track ingredients and claims, and develop AI-assisted
  product concepts. The platform bundles an AI research assistant, automated AI
  reporting, and data-backed product recommendations, and is used by 700+ teams
  at brands including Beiersdorf, Nivea, dm, BASF, Babor, and Lavera. Eyva is a
  portfolio company of Earlybird Venture Capital. It is a B2B SaaS delivered
  through a demo-led sales motion and an authenticated web application; no
  public developer API surface is currently published.
